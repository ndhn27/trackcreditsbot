name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackcredits
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: trackcredits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TELEGRAM_BOT_TOKEN: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      DATABASE_URL: "postgresql://trackcredits:testpass@localhost:5432/trackcredits_test"
      GENIUS_TOKEN: ""
      PAYMENT_PROVIDER: "manual"
      ADMIN_CHAT_ID: "123456789"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (smoke test)
        run: docker build -t trackcredits-bot:ci .

  deploy-railway:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'railway'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach
